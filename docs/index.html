<!DOCTYPE html>
<html>
<head>
  <title>SmartBlin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudfare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
  <!-- Hero -->
   <section class="hero">
      <video autoplay muted loop playsinline>
        <source src="assets/video/smartblin.mp4" type="video/mp4">
      </video>

    <div class="overlay"></div>
    
    <img src="assets/Images/logo-smartblin.png" class="logo-hero">

    

    <div class="scrool">↓ Role para descobrir</div>
   </section>
   <!-- Fim da Hero-->
  <!--  Header-->
  <header class="header">
    <div class="logo">
      <img src="assets/Images/logo-smartblin.png" alt="SmartBlin">
    </div>

      <nav class="menu">
        <ul>
          <li><a href="#">Inicial</a></li>
          <li><a href="#">Produtos</a></li>
          <li><a href="#">Trabalhe conosco</a></li>
          <li><a href="#">SAC</a></li>
        </ul>
      </nav>

    <div class="conta">
      <button>🙍‍♂️ Minha conta</button>
  
  </header>
  <!-- Fim da Header -->
<main>
<div class="carrossel">  
  <div class="slide">
      <h2>Novos modelos de Scooters disponiveis!</h2>
      <p> Venha descobrir o modelo de scooter ideal para seu dia a dia!</p>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSV_c1JAt1Kf0kBb6l3fcLQEzKOT4KdlO4p7uTe0ApC2qTrI6D_NbgjNT-4&s=10" class="imagenscarrossel">
  </div>
  <div class="slide">
    <h2>Como funciona nossos boletos?</h2>
    <p>Escolha a melhor opção para adquirir seu Aparelho novo!</p>
    <img src="https://macmagazine.com.br/wp-content/uploads/2025/07/30-Apple-iPhone-Android-logo-1260x840.jpg" class="imagenscarrossel">
  </div>
</div>
</main>
  <script src="script.js"></script>
</body>
</html>
